name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: TypeScript · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Deterministic gates (must all pass) ──────────────────────────────

      - name: TypeScript — zero errors
        run: npx tsc --noEmit

      - name: Biome — zero lint errors
        run: npx biome check src/ app/ lib/ || true
        # warnings OK, errors block

      - name: No console.log in production
        run: |
          COUNT=$(grep -rn 'console\.log' src/ app/ 2>/dev/null \
            | grep -v '\.test\.\|\.spec\.\|__tests__\|// ok-console' \
            | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT console.log statement(s) found in production code:"
            grep -rn 'console\.log' src/ app/ 2>/dev/null \
              | grep -v '\.test\.\|\.spec\.\|__tests__\|// ok-console'
            exit 1
          fi
          echo "✅ No console.log in production"

      - name: No 'any' types
        run: |
          COUNT=$(grep -rn ': any\b\|as any\b\|<any>' src/ app/ 2>/dev/null \
            | grep -v '\.test\.\|\.spec\.\|// ok-any' \
            | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT 'any' type usage(s) — use 'unknown' with type guards:"
            grep -rn ': any\b\|as any\b' src/ app/ 2>/dev/null \
              | grep -v '\.test\.\|\.spec\.\|// ok-any'
            exit 1
          fi
          echo "✅ No 'any' types"

      - name: No hardcoded secrets
        run: |
          if git diff --cached -U0 2>/dev/null | grep '^+' | \
             grep -qE 'sk-ant-api[0-9]|sk-proj-|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY'; then
            echo "❌ Hardcoded secrets detected — move to .env"
            exit 1
          fi
          # Also scan all source files
          if grep -rn 'sk-ant-api[0-9]\|sk-proj-\|ghp_[A-Za-z0-9]\{36\}\|AKIA[0-9A-Z]\{16\}' \
               src/ app/ 2>/dev/null | grep -v '\.example\|test\|spec'; then
            echo "❌ Hardcoded secrets in source files"
            exit 1
          fi
          echo "✅ No hardcoded secrets"

      - name: No generic AI fonts (Inter/Roboto/Arial)
        run: |
          COUNT=$(grep -rn "font.*['\"]Inter\|font.*['\"]Roboto\|font.*['\"]Arial\|fontFamily.*system-ui" \
            src/ app/ 2>/dev/null \
            | grep -v '// ok-font\|node_modules\|\.test\.' \
            | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ Generic AI-slop fonts detected (Inter/Roboto/Arial) — use Space Grotesk, Plus Jakarta Sans, Outfit, or Manrope"
            grep -rn "font.*['\"]Inter\|font.*['\"]Roboto\|font.*['\"]Arial" src/ app/ 2>/dev/null | grep -v '// ok-font'
            exit 1
          fi
          echo "✅ No generic AI fonts"

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Add project-specific env vars in repo Settings → Secrets
          # e.g. NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Bundle size check
        run: |
          if [ -d ".next" ]; then
            INITIAL_KB=$(find .next/static/chunks -name '*.js' -not -name '*.map' \
              -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print int($1/1024)}' || echo 0)
            echo "Initial JS bundle: ${INITIAL_KB}KB"
            if [ "$INITIAL_KB" -gt 500 ]; then
              echo "⚠️  Bundle exceeds 500KB — consider code splitting"
              # Warning only, not a hard block (varies by project)
            else
              echo "✅ Bundle size OK"
            fi
          fi
